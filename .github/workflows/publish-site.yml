# Build the landing site from the client-dist feed and publish it to GitHub Pages.
#
# The feed in Febris_ClientDist is the single source of truth. tools/generate_site.py renders
# site/ from it, so a published version, size or checksum can never drift from what the feed
# actually serves.
#
# site/ IS COMMITTED, and the pull_request job fails when it is stale. That is the same
# discipline docs/STATUS.md uses in the node repo: generated output is reviewable in the
# diff rather than appearing only inside a runner. On main, the scheduled run regenerates
# and commits any drift itself, so a feed release reaches the site without a human.
#
# == WHY feed.snapshot.json EXISTS ================================================================
#
# site/ is generated output committed to the repo, so a check that it is current is only
# meaningful against a FIXED input. The PR job used to regenerate from the LIVE feed, which meant
# every open pull request turned red the moment a release moved the feed, for reasons having
# nothing to do with its own diff. A required check that fails for unrelated reasons is one
# reviewers learn to ignore.
#
# So the feed is pinned. feed.snapshot.json is the exact feed site/ was built from, committed
# beside it. The PR job regenerates from that snapshot and needs no network at all, so it is
# deterministic and only fails when the PR itself makes site/ stale. The build job on main is
# what refreshes the snapshot from the live feed, and it commits the snapshot and site/ together
# so the two can never disagree.
#
# Pages must be enabled with Source set to GitHub Actions before the deploy step can work.
name: publish-site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily. The feed changes only on a release, so this is the safety net.
    - cron: "17 6 * * *"
  repository_dispatch:
    # The fast path. Febris_ClientDist sends this when manifest.json lands on its main, which
    # needs a token there with write access to THIS repo, because a workflow's own GITHUB_TOKEN
    # cannot dispatch across repositories. If that secret is absent the sender says so and this
    # trigger simply never fires, leaving the daily cron and workflow_dispatch to cover it.
    types: [feed-updated]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-site
  cancel-in-progress: false

jobs:
  # On a pull request, prove the committed site matches the feed. Never deploys.
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Deliberately built from the COMMITTED snapshot, not the live feed. This check must depend
      # only on what the pull request contains, or a release elsewhere turns it red.
      - name: The committed site must match the committed feed snapshot
        run: python3 tools/generate_site.py --check --manifest feed.snapshot.json

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This job, and only this job, is allowed to reach the live feed. Refreshing the snapshot
      # here is what lets every other consumer of it stay hermetic.
      - name: Refresh the feed snapshot from the live feed
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 5 \
            https://raw.githubusercontent.com/Febris-XR/Febris_ClientDist/main/manifest.json \
            -o feed.snapshot.json
          python3 -c "import json;d=json.load(open('feed.snapshot.json'));print('feed carries %d package(s), generated %s' % (len(d['packages']), d['generated']))"

      - name: Regenerate the site from the snapshot
        run: python3 tools/generate_site.py --manifest feed.snapshot.json

      # Commit drift back so the repository always shows what is deployed. The snapshot and site/
      # go in the SAME commit, because a snapshot that disagrees with the site it produced would
      # make the pull request check either wrongly red or wrongly green.
      - name: Commit the regenerated site if the feed moved
        run: |
          if git diff --quiet -- site/ feed.snapshot.json; then
            echo "no change: the site already matches the feed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/ feed.snapshot.json
          git commit -m "Regenerate the site from the distribution feed"
          git push

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
