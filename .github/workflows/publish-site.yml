# Build the landing site from the client-dist feed and publish it to GitHub Pages.
#
# The feed is the single source of truth. tools/generate_site.py reads manifest.json from
# Febris_ClientDist and renders site/, so a published version, size or checksum can never
# drift from what the feed actually serves.
#
# site/ IS COMMITTED, and the pull_request job fails when it is stale. That is the same
# discipline docs/STATUS.md uses in the node repo: generated output is reviewable in the
# diff rather than appearing only inside a runner. On main, the scheduled run regenerates
# and commits any drift itself, so a feed release reaches the site without a human.
#
# Pages must be enabled with Source set to GitHub Actions before the deploy step can work.
name: publish-site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily. The feed changes only on a release, so this is a safety net rather than the
    # primary path. A repository_dispatch from Febris_ClientDist is the fast path.
    - cron: "17 6 * * *"
  repository_dispatch:
    types: [feed-updated]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-site
  cancel-in-progress: false

jobs:
  # On a pull request, prove the committed site matches the feed. Never deploys.
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The committed site must match the live feed
        run: python3 tools/generate_site.py --check

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Regenerate the site from the feed
        run: python3 tools/generate_site.py

      # Commit drift back so the repository always shows what is deployed. Nothing to do on
      # the common path where the feed has not moved.
      - name: Commit the regenerated site if the feed moved
        run: |
          if git diff --quiet -- site/; then
            echo "no change: the site already matches the feed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/
          git commit -m "Regenerate the site from the distribution feed"
          git push

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
